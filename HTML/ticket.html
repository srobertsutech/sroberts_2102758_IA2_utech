<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coding Conf 2026 | Your Ticket</title>
	<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<a class="skip-link" href="#main">Skip to main content</a>

	<header>
		<img src="../assets/logo-full.svg" alt="Logo" width="209" height="30">
		<nav aria-label="Navigation Bar">
		<ul>
			<li><a href="index.html">Home</a></li>
			<li><a href="login.html">Register</a></li>
		</ul>
		</nav>
  </header>

	<main id="main">
		<!-- Ticket.js will fill in the name and email -->
		<section aria-labelledby="congrats-title">
			<h1 id="congrats-title">Congrats, <span id="ticket-heading-name" class="highlight"></span>! Your ticket is ready.</h1>
			<p class="lead">
				Registered with <span id="ticket-email" class="highlight"></span>.
				See you on October 26, 2026.
			</p>
		</section>

    <!-- Ticket.js will fill in every empty element below -->
		<section aria-label="Your conference ticket">
			<article class="ticket">
				<div class="ticket-main">
				<header class="ticket-brand">
					<img src="../assets/logo-mark.svg" alt="" width="40" height="40">
					<h2>Coding Conf</h2>
				</header>

				<p class="ticket-meta">Oct 26, 2026 / Papine, Kgn</p>

				<div class="ticket-holder">
					<img id="ticket-avatar" src="" alt="Profile picture of the ticket holder"
						width="80" height="80">
					<p id="ticket-name" class="ticket-name"></p>
					<p class="ticket-github">
						<img src="../assets/icon-github.svg" alt="" width="22" height="23">
						<a id="ticket-github" href="#" target="_blank" rel="noopener noreferrer"></a>
					</p>
				</div>
				</div>

				<p id="ticket-serial" class="ticket-serial"></p>
			</article>
		</section>
	</main>

	<footer>
		<p>&copy; 2026 Coding Conf. Shanique Roberts.</p>
	</footer>

	<script src="../js/ticket.js" defer></script>
</body>
</html>
